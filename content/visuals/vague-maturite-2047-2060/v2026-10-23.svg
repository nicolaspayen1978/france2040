  <text x="24" y="490" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c5c5c">Vente, remboursement comptant, refinancement, succession, autre : non chiffrés.</text>
  <text x="24" y="512" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c5c5c">L’ouverture au 31 décembre décale la vague d’un an. Ce n’est pas un remboursement unique de 700 Md€.</text>
  <text x="24" y="538" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#6a6a6a">Ni dangereuse ni sûre. La vie contractuelle n’est pas la duration économique.</text>
