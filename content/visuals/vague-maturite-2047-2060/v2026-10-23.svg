<!--
  En images — vague-maturite-2047-2060 v2026-10-23
  Colours from app/tokens.css: --paper #fff, --line #e6e6e6, --ink #1a1a1a,
  --muted #6a6a6a, --mark-blue #002395, --blue-2 #334a9a
  Same frozen path, shifted 20 years on a 1 January booking. Channels empty.
  Not coloured as a danger. Blue-2 is the second series, not a stress.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">La vague de maturité recopie l’origination</title>
  <desc id="desc">À 20 ans, ouverture au 1er janvier, le principal contractuel de 2047 à 2060 reproduit le chemin d’origination 2027–2040 : 25, 45, 65, 80, 90, 90, puis la décrue jusqu’à 0. Les canaux de vente, de remboursement, de refinancement, de succession et d’autre ne sont pas chiffrés. La vague n’est ni jugée dangereuse ni jugée sûre.</desc>
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="24" y="32" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a1a1a">La vague recopie la courbe, vingt ans plus tard</text>
  <text x="24" y="52" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#6a6a6a">Simulation France2040 · cas 20 ans · ouverture au 1er janvier · pas un jugement</text>

  <text x="24" y="78" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#002395">Origination 2027–2040, Md€</text>
